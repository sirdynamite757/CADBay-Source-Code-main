<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ensure relative paths work in both live preview and production -->
    <base href="./">
    <!-- CSS now referenced relative; server will prepends Body/ when necessary -->
    <link rel="stylesheet" href="ColorDefault.css">
    <title>CADBay - Homepage</title>
</head>
<body>
    <div id="header"></div>
    
    <div style="display: flex;">
        <div id="sidebar"></div>
        
        <main style="flex: 1; padding: 20px;">
            <p>Homepage in progress. Come back later for epicness!</p>
        </main>
    </div>
    
    <div id="footer"></div>
    <div id="auth-container"></div>

    <script>
        // simple helper that loads an HTML fragment and executes any embedded scripts
        function loadFragment(containerId, path) {
            return fetch(path)
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById(containerId);
                    container.innerHTML = html;

                    // find any scripts in the fetched HTML and re‑insert them so they execute
                    const tmp = document.createElement('div');
                    tmp.innerHTML = html;
                    tmp.querySelectorAll('script').forEach(old => {
                        const script = document.createElement('script');
                        if (old.src) {
                            script.src = old.src;
                        }
                        script.textContent = old.textContent;
                        document.head.appendChild(script);
                    });
                })
                .catch(error => console.error(`Error loading ${path}:`, error));
        }

        // Load header first, then initialize dark mode and other fragments
        loadFragment('header', 'Header.html').then(() => {
            initializeDarkMode();
            loadFragment('sidebar', 'Sidebar.html');
            loadFragment('footer', 'Footer.html');
            loadFragment('auth-container', 'LoginRegister.html');
        }).catch(error => {
            console.error('Failed to load fragments:', error);
        });

        // Dark mode and header behavior logic
        function initializeDarkMode() {
            console.log('initializeDarkMode running');
            const darkModeToggle = document.getElementById('darkModeToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            const dropdownBtn = document.querySelector('.dropdown-btn');
            const dropdownItems = document.querySelector('.dropdown-items');
            const body = document.body;

            if (!darkModeToggle || !toggleIcon) {
                console.log('dark mode elements missing, aborting');
                return;
            }

            // restore dark mode from localStorage
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            console.log('restoring dark mode:', isDarkMode);
            if (isDarkMode) {
                body.classList.add('dark-mode');
                toggleIcon.classList.add('dark');
                toggleIcon.classList.remove('light');
            } else {
                toggleIcon.classList.add('light');
                toggleIcon.classList.remove('dark');
            }

            // dark mode toggle listener
            darkModeToggle.addEventListener('click', function(e) {
                e.preventDefault();
                body.classList.toggle('dark-mode');
                const isNowDark = body.classList.contains('dark-mode');
                console.log('toggle clicked, now dark?', isNowDark);
                toggleIcon.classList.toggle('light');
                toggleIcon.classList.toggle('dark');
                localStorage.setItem('darkMode', isNowDark);
            });

            // dropdown menu logic (only if dropdown elements exist)
            if (dropdownBtn && dropdownItems) {
                dropdownBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isOpen = dropdownItems.style.display === 'block';
                    dropdownItems.style.display = isOpen ? 'none' : 'block';
                });

                document.addEventListener('click', function(event) {
                    if (!event.target.closest('.dropdown-menu')) {
                        dropdownItems.style.display = 'none';
                    }
                });
            }
        }
    </script>
</body>
</html>
