<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ColorDefault.css">
    <title>CADBay - Homepage</title>
</head>
<body>
    <div id="header"></div>
    
    <div style="display: flex;">
        <div id="sidebar"></div>
        
        <main style="flex: 1; padding: 20px;">
            <p>Homepage in progress. Come back later for epicness!</p>
        </main>
    </div>
    
    <div id="footer" ></div>

    <script>
        function attachHeaderBehavior() {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            const dropdownBtn = document.querySelector('.dropdown-btn');
            const dropdownItems = document.querySelector('.dropdown-items');
            const body = document.body;

            if (!darkModeToggle || !toggleIcon || !dropdownBtn || !dropdownItems) return;

            // restore dark mode
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                body.classList.add('dark-mode');
                toggleIcon.classList.add('dark');
                toggleIcon.classList.remove('light');
            } else {
                toggleIcon.classList.add('light');
                toggleIcon.classList.remove('dark');
            }

            darkModeToggle.addEventListener('click', function(e) {
                e.preventDefault();
                body.classList.toggle('dark-mode');
                const isNowDark = body.classList.contains('dark-mode');
                toggleIcon.classList.toggle('light');
                toggleIcon.classList.toggle('dark');
                localStorage.setItem('darkMode', isNowDark);
            });

            dropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = dropdownItems.style.display === 'block';
                dropdownItems.style.display = isOpen ? 'none' : 'block';
            });

            document.addEventListener('click', function(event) {
                if (!event.target.closest('.dropdown-menu')) {
                    dropdownItems.style.display = 'none';
                }
            });
        }

        // Load header and initialize behavior after insertion
        fetch('Header.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('header').innerHTML = html;
                attachHeaderBehavior();
            })
            .catch(error => console.error('Error loading header:', error));
        
        // Load sidebar
        fetch('Sidebar.html')
            .then(response => response.text())
            .then(html => document.getElementById('sidebar').innerHTML = html)
            .catch(error => console.error('Error loading sidebar:', error));
        
        // Load footer
        fetch('Footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html)
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
