<VirtualHost *:80>
    ServerName cadbay.local
    ServerAlias *.cadbay.local
    
    # Document root
    DocumentRoot /home/sirdynamite757/CADBay-Source-Code-main

    # Change this path in api-config.js and here together if the API prefix changes.
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api
    
    # Directory permissions
    <Directory /home/sirdynamite757/CADBay-Source-Code-main>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable logging with monitor integration
    CustomLog ${APACHE_LOG_DIR}/cadbay_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/cadbay_error.log
    
    # Monitor module integration - pipe logs to monitor
    # Uncomment if monitor supports log piping
    # CustomLog "|/usr/local/bin/cadbay-monitor" combined
    
    # Set log level
    LogLevel warn
    
    # Performance settings
    KeepAlive On
    KeepAliveTimeout 5
    
    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript
    </IfModule>
    
    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
    </IfModule>
    
    # PHP support (if needed)
    <IfModule mod_php.c>
        AddType application/x-httpd-php .php
        php_value upload_max_filesize 100M
        php_value post_max_size 100M
    </IfModule>
    
</VirtualHost>

<VirtualHost *:443>
    ServerName cadbay.local
    ServerAlias *.cadbay.local
    
    # SSL configuration (update paths as needed)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/cadbay.crt
    SSLCertificateKeyFile /etc/ssl/private/cadbay.key
    
    # Document root
    DocumentRoot /home/sirdynamite757/CADBay-Source-Code-main

    # Keep HTTPS API requests on the same C server as HTTP API requests.
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api
    
    # Directory permissions
    <Directory /home/sirdynamite757/CADBay-Source-Code-main>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable logging
    CustomLog ${APACHE_LOG_DIR}/cadbay_access_ssl.log combined
    ErrorLog ${APACHE_LOG_DIR}/cadbay_error_ssl.log
    
    # Performance settings
    KeepAlive On
    KeepAliveTimeout 5
    
    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript
    </IfModule>
    
    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>
    
</VirtualHost>
