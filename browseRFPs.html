<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFP Browser</title>
    <link rel="stylesheet" href="colorDefault.css">
    <script src="api-config.js"></script>
    <script src="dynamics.js"></script>
</head>
<body>
    <div id="header">
        
    </div>
<h1>RFP Browser</h1>
    <filter-menu>
        <form id="rfp-filter-form">
            <label for="project-type">Project Type:</label>
            <select id="project-type" name="project-type">
                <option value="">All</option>
                <option value="engineering">Engineering</option>
                <option value="architecture">Architecture</option>
                <option value="industrial">Industrial</option>
                <option value="product-visualisation">Product Visualisation</option>
                <option value="webpage-development">Webpage Development</option>
                <option value="game-programming">Game Programming</option>
                <option value="tool-programming">Tool Programming</option>
                <option value="game-texturing">Game Texturing</option>
                <option value="game-modeling">Game Modeling</option>
                <option value="game-animation">Game Animation</option>
                <option value="stock-images">Stock Images</option>
                <option value="other">Other</option>
            </select>
            <label for="language">Language/Program:</label>
            <select id="language" name="language">
                <option value="">All Languages</option>
            </select>
           <!-- <input type="submit" value="Filter">  auto refresh on action select -->
            <label for="columns">Columns:</label>
            <select id="columns" name="columns">
                <option value="1">1 Column</option>
                <option value="2">2 Columns</option>
                <option value="3">3 Columns</option>
                <option value="4">4 Columns</option>
            </select>
        </form>



        <form id="columns-form">
            
        </form>
    </filter-menu>
    <div id="rfp-results" class="rfp-grid"></div>

    <div class="pagination">
        <button id="show-more" class="show-more-button">Show More</button>
    </div>

    <p id="rfp-status" role="status">Loading RFPs...</p>

    <dialog id="rfp-details-dialog" aria-labelledby="rfp-details-title">
        <button type="button" id="close-rfp-details" aria-label="Close details">×</button>
        <h2 id="rfp-details-title"></h2>
        <dl>
            <dt>Project type</dt>
            <dd id="rfp-details-type"></dd>
            <dt>Language or program</dt>
            <dd id="rfp-details-program"></dd>
            <dt>Budget</dt>
            <dd id="rfp-details-budget"></dd>
        </dl>
        <p id="rfp-details-description"></p>
        <a id="rfp-details-link" class="view-rfp-button">Open full RFP</a>
    </dialog>


    <button id="scroll-to-top" aria-label="Scroll to top">↑</button>
    <script>
        const filterForm = document.getElementById('rfp-filter-form');
        const projectTypeSelect = document.getElementById('project-type');
        const languageSelect = document.getElementById('language');
        const results = document.getElementById('rfp-results');
        const status = document.getElementById('rfp-status');
        const showMoreButton = document.getElementById('show-more');
        
        let rfps = [];
        let ads = [];
        let filteredRfps = [];
        let currentPage = 0;
        const itemsPerPage = 10;
        let totalRfps = 0;

        // Function to load RFPs from text files
        async function loadRfpsFromText() {
            try {
                status.textContent = 'Loading RFPs...';

                // Simulate loading from text files - in a real implementation, 
                // this would fetch from actual text files
                const response = await fetch(cadbayApiUrl('/rfps'));
                if (!response.ok) {
                    throw new Error('Failed to load RFPs');
                }
                rfps = await response.json();

                // Load ads as well
                const adResponse = await fetch(cadbayApiUrl('/ads'));
                if (!adResponse.ok) {
                    throw new Error('Failed to load ads');
                }
                ads = await adResponse.json();

                status.textContent = 'RFPs loaded successfully';// hide after 5secs
                setTimeout(() => {
                    status.textContent = '';
                }, 5000);
                updatePrograms();
                renderRfps();
            } catch (error) {
                console.error('Error loading RFPs:', error);
                status.textContent = 'Error loading RFPs: ' + error.message;
            }
        }

        // Ad-tier RFPs are adverts, so they follow the same rules as banner and
        // sidebar ads: hidden for premium accounts, and controlled by the
        // header ad toggle for developer accounts.
        function areRfpAdsEnabled() {
            if (typeof window.areAdsEnabled === 'function') {
                return window.areAdsEnabled(typeof getSessionData === 'function' ? getSessionData() : null);
            }
            return true;
        }

        function isAdRfp(rfp) {
            return String(rfp && rfp.tier || '').trim().toLowerCase() === 'ad';
        }

        function normalize(value) {
            return String(value || '').trim().toLowerCase().replace(/visualisation/g, 'visualization');
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[character]));
        }

        function updatePrograms() {
            const selectedType = normalize(projectTypeSelect.value);
            const programs = [...new Set(rfps
                .filter(rfp => !selectedType || normalize(rfp.project_type) === selectedType)
                .map(rfp => rfp.program)
                .filter(Boolean))].sort();
            languageSelect.innerHTML = '<option value="">All Languages</option>';
            programs.forEach(program => languageSelect.add(new Option(program, program)));
        }

        function renderRfps() {
            const projectType = normalize(projectTypeSelect.value);
            const program = normalize(languageSelect.value);

            // Filter RFPs based on selections. Adverts are dropped here when
            // ads are switched off so they vanish from the list and the
            // "show more" count straight away.
            const showAds = areRfpAdsEnabled();
            filteredRfps = rfps.filter(rfp =>
                (showAds || !isAdRfp(rfp)) &&
                (!projectType || normalize(rfp.project_type) === projectType) &&
                (!program || normalize(rfp.program) === program)
            );

            totalRfps = filteredRfps.length;
            currentPage = 0;

            // Clear previous results
            results.innerHTML = '';

            // Show initial page
            showPage(currentPage);
        }

        function showPage(page) {
            const startIndex = page * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredRfps.length);

            // Clear previous results
            results.innerHTML = '';

            // Show at most itemsPerPage RFPs per page
            const pageRfps = filteredRfps.slice(startIndex, endIndex);

            // Insert ads every 3 RFPs
            let adIndex = 0;
            const showAds = areRfpAdsEnabled();
            const adCount = showAds ? ads.length : 0;

            pageRfps.forEach((rfp, index) => {
                // Add RFP
                const rfpID = rfp.id;
                const rfpTitle = escapeHtml(rfp.title || rfp[1]);
                const rfpDescription = escapeHtml(rfp.description || rfp[2]);
                const rfpType = escapeHtml(rfp.project_type || rfp[8]);
                const rfpProgram = escapeHtml(rfp.program || rfp[9]);

                results.innerHTML += `
                <div class="rfp-box">
                    <h2>${rfpTitle}</h2>
                    <p>${rfpDescription}</p>
                    <p>Project Type: ${rfpType}</p>
                    <p>Language: ${rfpProgram}</p>
                    <button class="view-rfp-button" onclick="viewRFP('${rfpID}')">View Details</button>
                    <button class="ignore-rfp-button" onclick="ignoreRFP('${rfpID}')">Ignore</button>
                </div>
                `;

                // Insert ad every 3 RFPs (except at the end)
                if ((index + 1) % 3 === 0 && (index + 1) < pageRfps.length) {
                    if (adIndex < adCount) {
                        results.innerHTML += `
                        <div class="ad-box">
                            <h3>Advertisement</h3>
                            <p>Special offer for ${rfpType} projects</p>
                            <button onclick="clickAd()">Learn More</button>
                        </div>
                        `;
                        adIndex++;
                    }
                }
            });

            // Show/hide show more button based on whether there are more items
            showMoreButton.style.display = (endIndex < filteredRfps.length) ? 'inline-block' : 'none';
        }

        function showMore() {
            currentPage++;
            showPage(currentPage);
        }

        function viewRFP(rfpId) {
            const rfp = rfps.find(item => String(item.id) === String(rfpId));
            const dialog = document.getElementById('rfp-details-dialog');
            if (!rfp || !dialog) return;

            document.getElementById('rfp-details-title').textContent =
                rfp.title || rfp.project_name || 'Untitled RFP';
            document.getElementById('rfp-details-type').textContent =
                rfp.project_type || 'Not specified';
            document.getElementById('rfp-details-program').textContent =
                rfp.program || 'Not specified';
            document.getElementById('rfp-details-budget').textContent =
                rfp.budget || rfp.proposed_price || 'Not specified';
            document.getElementById('rfp-details-description').textContent =
                rfp.long_description || rfp.description || 'No additional details available.';

            const fullPageLink = document.getElementById('rfp-details-link');
            fullPageLink.href = rfp.ad_path
                ? rfp.ad_path
                : `/rfp-template?id=${encodeURIComponent(rfp.id)}`;
            fullPageLink.target = '_self';
            if (typeof dialog.showModal === 'function') {
                dialog.showModal();
            } else {
                dialog.setAttribute('open', '');
            }
        }

        function ignoreRFP(rfpId) {
            // Remove from filtered list
            filteredRfps = filteredRfps.filter(rfp => rfp.id !== rfpId);
            totalRfps = filteredRfps.length;
            
            // Re-render the current page
            showPage(currentPage);
            
            alert(`Ignored RFP: ${rfpId}`);
        }

        function clickAd() {
            alert('Ad clicked!');
            // Implement ad tracking here
        }

        // Event listeners
        filterForm.addEventListener('submit', function(e) {
            e.preventDefault();
            renderRfps();
        });

        projectTypeSelect.addEventListener('change', function() {
            updatePrograms();
            renderRfps();
        });

        showMoreButton.addEventListener('click', showMore);
        document.getElementById('close-rfp-details').addEventListener('click', () => {
            document.getElementById('rfp-details-dialog').close();
        });
        document.getElementById('rfp-details-dialog').addEventListener('click', event => {
            if (event.target === event.currentTarget) event.currentTarget.close();
        });

        // The header ad toggle (and the settings page) call this so the list
        // redraws as soon as adverts are switched on or off.
        window.onAdsVisibilityChanged = function () {
            if (rfps.length) renderRfps();
        };

        // Initialize
        loadRfpsFromText();
    </script>

    <div id = 'footer'>
        <p>© 2024 RFP Browser. All rights reserved.</p>
    </div>
</body>
</html>
