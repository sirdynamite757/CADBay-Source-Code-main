<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Proposals - CADBay</title>
    <meta name="application-name" content="CADBay - my-proposals">
    <link rel="stylesheet" href="colorDefault.css">
    <script src="dynamics.js"></script>

<body id="cadbay-my-proposals" data-app="cadbay">
    <div id="header"></div>

    <main class="account-page">
        <h1>My Proposals</h1>
        <p>Track proposals submitted for CADBay RFPs.</p>
        <div class="account-empty-state">
            <h2>No proposals yet</h2>
            <p>Proposal submission is not available until an RFP owner opens a project for bids.</p>
            <a href="/my-rfps">Browse your RFPs</a>
        </div>
    </main>

    <div id="footer"></div>
