<!DOCTYPE html>
<html>
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="Page Creator.js"></script>
  <link rel="stylesheet" href="../Body/ColorDefault.css">
  <title>RFP Template</title>
    <meta name="application-name" content="CADBay - RFPs RFPTemplate">
</head>
<body id="cadbay-rfps-rfptemplate" data-app="cadbay">
  <div id="header"></div>
  
  <div style="display: flex;">
    <div id="sidebar"></div>
    
    <main style="flex: 1; padding: 20px;">
      <h1>RFP Template</h1>
      <p>This is a template for RFPs (Request for Proposals). No customer should ever see this page but it is crucial to our business's infrastructure.</p>
      
      <picture>
        <source srcset="Pic1.webp" type="image/webp">
        <img src="Pic1.jpg" alt="Description of image">
      </picture>
      <picture>
        <source srcset="Pic2.webp" type="image/webp">
        <img src="Pic2.jpg" alt="Description of image">
      </picture>
      <picture>
        <source srcset="Pic3.webp" type="image/webp">
        <img src="Pic3.jpg" alt="Description of image">
      </picture>
    </main>
  </div>
  
  <div id="footer"></div>

  <script>
    // Load header
    fetch('../Body/Header.html')
        .then(response => response.text())
        .then(html => document.getElementById('header').innerHTML = html)
        .catch(error => console.error('Error loading header:', error));
    
    // Load sidebar
    fetch('../Body/Sidebar.html')
        .then(response => response.text())
        .then(html => document.getElementById('sidebar').innerHTML = html)
        .catch(error => console.error('Error loading sidebar:', error));
    
    // Load footer
    fetch('../Body/Footer.html')
        .then(response => response.text())
        .then(html => document.getElementById('footer').innerHTML = html)
        .catch(error => console.error('Error loading footer:', error));
  </script>
</body>
</html>
